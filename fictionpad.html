            ? html`<div class="hint">Off — enable it above.</div>`
            : html`
            <div class="grid3">
              ${numField('toolCallCap', 'Max tool calls per generation', TOOL_CALL_CAP, { min: 1, max: 25 })}
            </div>`}`,
          'Protocol instructions are editable in the Prompts tab.')}`}

      ${tab === 'prompts' && html`
        ${section('Core', html`
          ${promptField('platformPrompt', 'Platform system prompt — lowest instruction rank; {{user}} works here', DEFAULT_PLATFORM_PROMPT, 5)}
          ${draft.toolsEnabled !== false
            ? promptField('toolsPrompt', 'Tool protocol instructions — appended to the platform prompt; teaches the model the format. {{user}} works here.', TOOLS_PROMPT, 9)
            : html`<div class="hint">Tool protocol prompt hidden — tool calling is off (Features tab).</div>`}
          ${draft.toolsEnabled !== false && draft.imagesEnabled
            ? promptField('imagePrompt', 'Image generation instructions — appended to the platform prompt; teaches the model the generate_image block', DEFAULT_IMAGE_PROMPT, 8,
              'Sent only while image generation is on (Features tab). The model attaches at most one image per reply, as the last block.')
            : html`<div class="hint">Image generation prompt hidden — image generation is off (Features tab; it rides tool calling, which must stay on).</div>`}
          ${draft.multiSpeaker !== false
            ? promptField('speakerPrompt', 'Multi-speaker instructions — appended to the platform prompt.', SPEAKER_PROMPT, 4)
            : html`<div class="hint">Multi-speaker prompt hidden — multi-speaker is off (Features tab).</div>`}`)}
        ${section('Aux calls', html`
          ${promptField('suggestionsPrompt', 'Suggestions prompt — asks the aux model for reply options', DEFAULT_SUGGESTIONS_PROMPT, 3,
            '{{user}} = persona name, {{count}} and {{words}} = the values from the Features tab. Used when suggestions are on.')}
          ${promptField('memoryPrompt', 'Memory summary prompt — auto-summaries and /memory', DEFAULT_MEMORY_PROMPT, 3,
            '{{chars}} = note max characters (Features tab).')}
          ${promptField('loreExtractPrompt', 'Lore extraction prompt — proposes new lore pieces on the memory cadence', DEFAULT_LORE_EXTRACT_PROMPT, 4,
            '{{max}} = max pieces per pass (Features tab).')}
          ${promptField('improvePrompt', '/improve prompt — rewrites your draft in character', DEFAULT_IMPROVE_PROMPT, 2,
            '{{user}} = persona name (+ description, when set).')}
          ${promptField('impersonatePrompt', '/impersonate prompt — drafts your next message as you ("✦ Write my reply")', DEFAULT_IMPERSONATE_PROMPT, 3,
            '{{user}} = persona name. The draft lands in the composer for editing — never sent automatically.')}
          ${promptField('recapPrompt', '/recap prompt — third-person recap of recent messages', DEFAULT_RECAP_PROMPT, 2,
            '{{words}} = word target (Features tab).')}`)}
        ${section('✦ Generator', html`
          ${promptField('scenarioGenPrompt', 'Scenario generator prompt — ✦ Generate in the scenario editor', DEFAULT_SCENARIO_GEN_PROMPT, 6,
            'The reply contract is one JSON object with the scenario fields; the request and the current draft are sent as context.')}
          ${promptField('characterGenPrompt', 'Character generator prompt — ✦ Generate in the character editor', DEFAULT_CHARACTER_GEN_PROMPT, 4,
            'The reply contract is one JSON object with name, content, keys and greeting.')}
          ${promptField('pieceGenPrompt', 'Lore piece generator prompt — ✦ on a lore piece (scenario or chat lore)', DEFAULT_PIECE_GEN_PROMPT, 4,
            'The reply contract is one JSON object with type, title, content, keys and pinned.')}
          ${promptField('avatarGenPrompt', 'Avatar image prompt — ✦ on the avatar field in the editors', DEFAULT_AVATAR_GEN_PROMPT, 3,
            'Condenses the name + card into a square-portrait prompt for the image API; only used when image generation is enabled (Features tab).')}`)}`}
    <//>`;
}
// ============================================================================
// COMPONENTS: LOGIT BIAS EDITOR — { [inputString]: { ids, strings, power } }.
// Literal strings are tokenized via /tokenize ("!==" + s, prefix tokens sliced
// off to dodge the leading-space artifact); raw "/id,id/" syntax always works.
// ============================================================================
// Hoisted out of LogitBiasModal: defined inline it was a new component type
// every render, remounting every row on each keystroke.
function LogitBiasRow({ k, e, onRemove }) {
  return html`
    <div class="kv">
      <span class="k" style=${{ overflow: 'hidden', textOverflow: 'ellipsis', maxWidth: '55%' }}
        title=${(e.strings ?? []).join('')}>${k} <span class="hint">[${(e.ids ?? []).join(',')}]</span></span>
      <span>${e.power > 0 ? '+' : ''}${e.power}
        <button class="btn small ghost" style=${{ marginLeft: '6px' }} aria-label="Remove entry"
          onClick=${() => onRemove(k)}>✕</button></span>
    </div>`;
}

function LogitBiasModal({ logitBias, onChange, onTokenize, onClose }) {
  const [text, setText] = useState('');
  const [power, setPower] = useState(-10);
  const [busy, setBusy] = useState(false);
  const [hint, setHint] = useState(null);
  const entries = Object.entries(logitBias ?? {});
  const remove = (key) => onChange(Object.fromEntries(entries.filter(([k]) => k !== key)));

  const add = async () => {
    const s = text.trim();
    if (!s) return;
    setBusy(true); setHint(null);
    try {
      let ids = null, strings = null;
      const raw = /^\/([\d,\s]+)\/$/.exec(s);
      if (raw) {
        ids = raw[1].split(',').map(x => parseInt(x.trim(), 10)).filter(Number.isFinite);
        strings = ids.map(String);
      } else {
        const full = await onTokenize(`!==${s}`);
        const pre = await onTokenize('!==');
        // Both calls must succeed: without the "!=="-only baseline we can't
        // tell where the prefix ends, so bias would land on the wrong token.
        if (full?.ids && pre?.ids) {
          ids = full.ids.slice(pre.ids.length);
          strings = full.strings ? full.strings.slice((full.strings.length ?? 0) - ids.length) : ids.map(String);
        }
        if (!ids?.length) {
          setHint('Tokenizer endpoint unavailable for literal strings — use raw /id,id/ syntax (e.g. /123,456/).');
          return;
        }
      }
      const p = Math.max(-100, Math.min(100, Number(power) || 0));
      if (p === 0) remove(s); // power 0 deletes
      else onChange({ ...(logitBias ?? {}), [s]: { ids, strings, power: p } });
      setText('');
    } finally { setBusy(false); }
  };

  const pos = entries.filter(([, e]) => e.power > 0).sort((a, b) => b[1].power - a[1].power);
  const neg = entries.filter(([, e]) => e.power < 0).sort((a, b) => a[1].power - b[1].power);

  return html`
    <${Modal} title="Logit bias" onClose=${onClose}>
      <div class="hint" style=${{ marginBottom: '8px' }}>
        Applied to every generation as OpenAI logit_bias (first token of each entry). −100…100; 0 deletes.
      </div>
      <div style=${{ display: 'flex', gap: '6px', alignItems: 'center', marginBottom: '8px' }}>
        <input type="text" style=${{ flex: 1 }} placeholder='Literal string, or /id,id/' value=${text}
          onInput=${(e) => setText(e.target.value)}
          onKeyDown=${(e) => { if (e.key === 'Enter' && !busy) add(); }} />
        <input type="number" style=${{ width: '80px' }} min="-100" max="100" value=${power}
          onInput=${(e) => setPower(Number(e.target.value))} title="Bias −100…100" />
        <button class="btn primary" disabled=${busy || !text.trim()} onClick=${add}>${busy ? '…' : 'Add'}</button>
      </div>
      ${hint && html`<div class="hint warn">${hint}</div>`}
      ${entries.length === 0 && html`<div class="hint">No entries.</div>`}
      ${pos.length > 0 && html`<h4>Encouraged</h4>${pos.map(([k, e]) => html`<${LogitBiasRow} key=${k} k=${k} e=${e} onRemove=${remove} />`)}`}
      ${neg.length > 0 && html`<h4>Discouraged</h4>${neg.map(([k, e]) => html`<${LogitBiasRow} key=${k} k=${k} e=${e} onRemove=${remove} />`)}`}
    <//>`;
}

// ============================================================================
// COMPONENTS: CONTEXT INSPECTOR — renders the assembler manifest. This is the
// activation-observability surface: exactly what was injected, and why.
// ============================================================================
// Expandable row: one-line preview collapsed, full content on click, native
// tooltip with a longer excerpt on hover.
function InspectorRow({ pills = [], title, meta, preview, content, dimmed = false }) {
  const [open, setOpen] = useState(false);
  return html`
    <div class="lore-item-row ${dimmed ? 'dimmed' : ''}" title=${content ? String(content).slice(0, 500) : null}>
      <div class="row" style=${{ cursor: 'pointer' }} onClick=${() => setOpen(!open)}>
        <span class="hint">${open ? '▾' : '▸'}</span>
        ${pills.map((p, i) => html`<span key=${i} class="pill ${p.cls}">${p.text}</span>`)}
        <span style=${{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>${title}</span>
        ${meta && html`<span class="hint">${meta}</span>`}
      </div>
      ${!open && preview && html`<div class="ir-preview">${preview}</div>`}
      ${open && content && html`<div class="ir-content">${content}</div>`}
    </div>`;
}

// Collapsible section header (Context / Lore / Memories) — open by default,
// collapse state persisted per section. `meta` renders dim after the title.
function InspectorSection({ title, count, meta, children }) {
  const [open, setOpen] = usePersistentState(`fictionpad.inspector.section.${title}`, true);
  return html`
    <div>
      <h4 class="ir-toggle" onClick=${() => setOpen(o => !o)}>
        ${open ? '▾' : '▸'} ${title}${count != null ? ` (${count})` : ''}${meta && html` <span class="hint">${meta}</span>`}</h4>
      ${open && children}
    </div>`;
}

// One budget layer as a lore-row-style card: name + tokens/cap, a usage meter
// (warning-colored past 90%), a one-line note collapsed, context on expand.
// Expanded by default; open state persisted per card.
function LayerCard({ name, tokens, cap, note, about }) {
  const [open, setOpen] = usePersistentState(`fictionpad.inspector.layer.${name}`, true);
  const pct = cap > 0 ? Math.min(100, Math.round((tokens / cap) * 100)) : 0;
  return html`
    <div class="lore-item-row">
      <div class="row" style=${{ cursor: 'pointer' }} onClick=${() => setOpen(o => !o)}>
        <span class="hint">${open ? '▾' : '▸'}</span>
        <span style=${{ flex: 1 }}>${name} <span class="hint">(${pct}%)</span></span>
        <span class="hint" style=${{ fontVariantNumeric: 'tabular-nums' }}>${tokens} / ${cap}t</span>
      </div>
      <div class="lt-meter">
        <div class="lt-fill ${pct > 90 ? 'lt-hot' : ''}"
          style=${{ width: (tokens > 0 ? Math.max(pct, 1) : 0) + '%' }} />
      </div>
      ${!open && note && html`<div class="ir-preview">${note}</div>`}
      ${open && about && html`<div class="ir-content">${about}</div>`}
    </div>`;
}

function ContextInspector({ manifest, onPreview, hasChat, realCounts, auxLog = [], loreQueue = [] }) {
  const [showInactive, setShowInactive] = useState(false);
  const [showInactiveMem, setShowInactiveMem] = useState(false);
  // Aux calls (memory summaries, lore extraction, suggestions, /improve,
  // /recap) are separate requests that never enter the main context, so the
  // manifest can't show them. Session log (last 12), newest first.
  const auxSection = (auxLog ?? []).length > 0 && html`
    <${InspectorSection} title="Aux calls" count=${auxLog.length}>
      ${[...auxLog].reverse().map((a, i) => html`
        <${InspectorRow} key=${`${a.at}-${i}`} dimmed=${!a.ok}
          pills=${[{ text: a.ok ? 'ok' : 'failed', cls: a.ok ? 'ok' : 'pinned' }]}
          title=${a.kind} meta=${`${new Date(a.at).toLocaleTimeString()} · ~${estimateTokens(`${a.system}\n${a.user}`)}t in`}
          preview=${toPreview(a.out, 140)}
          content=${`[system]\n${a.system}\n\n[user]\n${a.user}\n\n[${a.ok ? 'response' : 'error'}]\n${a.out}`} />`)}
    <//>`;
  // Pending emergent-lore proposals (chat.loreQueue) — chat state, not
  // manifest data, so they never appear in "Lore injected". Shown in both
  // branches: a queue can be waiting before any generation has run.
  const queueSection = (loreQueue ?? []).length > 0 && html`
    <${InspectorSection} title="Suggested lore" count=${loreQueue.length} meta="awaiting review">
      ${loreQueue.map(q => html`
        <${InspectorRow} key=${q.id}
          pills=${[{ text: queuePillOf(q), cls: '' }]}
          title=${q.title || '(untitled)'}
          preview=${toPreview(q.content, 140)}
          content=${`${q.note ? `[change] ${q.note}\n\n` : ''}${q.content ?? ''}${q.oldContent != null ? `\n\n[was] ${q.oldContent}` : ''}${(q.keys ?? []).length ? `\n\n[keys] ${q.keys.join(', ')}` : ''}`} />`)}
      <div class="hint" style=${{ margin: '2px 0 8px' }}>Not in context yet — accept or dismiss in the Chat tab.</div>
    <//>`;
  if (!manifest?.layers) return html`
    <div>
      <div class="hint">No generation recorded yet. Send a message, or preview the context that would be sent right now.</div>
      ${hasChat && html`<button class="btn" style=${{ marginTop: '8px' }} onClick=${() => onPreview()}>Preview current context</button>`}
      ${queueSection}
      ${auxSection}
    </div>`;
  const L = manifest.layers;
  // One number per card, one source per panel: when /tokenize gave us a real
  // total, every card shows its real count (est fallback for empty blocks);
  // otherwise all cards are estimates. The greeting is the first chat message,
  // so it counts toward History here — tokens AND cap both include it (it's
  // budget-pinned), keeping the card's % honest.
  const exact = realCounts?.total != null;
  const tok = (est, real) => (exact ? (real ?? est) : est);
  const total = tok(manifest.totalTokens, realCounts?.total);
  const src = exact ? 'exact' : 'estimated';
  const hasGreeting = (L.greeting?.tokens ?? 0) > 0;
  const histTok = tok(L.history.tokens + (L.greeting?.tokens ?? 0),
    exact ? (realCounts?.history ?? 0) + (realCounts?.greeting ?? 0) : null);
  const histCap = L.history.cap + (L.greeting?.tokens ?? 0);
  const keptNote = L.history.dropped
    ? `${L.history.kept} of ${L.history.kept + L.history.dropped} messages kept — oldest dropped to fit`
    : `all ${L.history.kept} message${L.history.kept === 1 ? '' : 's'} kept`;
  const memPinned = L.memory.memories.filter(m => m.pinned).length;
  // Semantic activation observability: per-piece cosine scores from the last
  // generation (only present when an embedding model ran). Injected smart
  // pieces show their score; inactive ones show score vs threshold so
  // near-misses answer "why didn't this trigger?".
  const sem = manifest.semantic ?? null;
  const semScore = new Map((sem?.scores ?? []).map(s => [s.id, s.score]));
  const semPill = (id, injected) => {
    if (!semScore.has(id)) return [];
    const score = semScore.get(id);
    if (injected) return [{ text: `sim ${score.toFixed(2)}`, cls: 'semantic' }];
    const near = score >= (sem.threshold - 0.10);
    return [{ text: `sim ${score.toFixed(2)} < ${sem.threshold.toFixed(2)}`, cls: near ? 'link-boosted' : '' }];
  };
  return html`
    <div>
      <${InspectorSection} title="Context"
        meta=${`(${manifest.budget > 0 ? Math.round((total / manifest.budget) * 100) : 0}%)`}>
        <${LayerCard} name="Static"
          tokens=${tok(L.static.tokens, realCounts?.static)} cap=${L.static.cap}
          note="platform + speaker/tools prompts · scenario · persona · directives"
          about="Platform system prompt, multi-speaker and tool-calling instructions, scenario instructions and backstory, persona, per-chat custom instructions, author's note, and the length directive — always sent in full." />
        <${LayerCard} name="Lore"
          tokens=${tok(L.lore.tokens, realCounts?.lore)} cap=${L.lore.cap}
          note=${`${L.lore.pieces.length} injected${(L.lore.inactive ?? []).length ? ` · ${L.lore.inactive.length} not` : ''}`}
          about="Lore pieces pinned or triggered by recent messages, ordered by weight and trimmed to budget." />
        <${LayerCard} name="Memory"
          tokens=${tok(L.memory.tokens, realCounts?.memory)} cap=${L.memory.cap}
          note=${L.memory.memories.length
            ? `${L.memory.memories.length} injected · ${memPinned} pinned${L.memory.recall === 'smart' ? ' · smart recall' : ''}` : 'no memories yet'}
          about="Pinned memories first, then recent ones, trimmed to budget; new summaries are written as the chat grows. With smart recall (Settings → Generation), older memories ranked by similarity to the recent conversation are injected too." />
        <${LayerCard} name="History"
          tokens=${histTok} cap=${histCap}
          note=${hasGreeting ? `greeting + ${keptNote}` : keptNote}
          about="Chat messages, oldest dropped first under pressure; the greeting is pinned and always sent — its tokens count toward both sides of this card." />
        <${LayerCard} name="Total"
          tokens=${total} cap=${manifest.budget}
          about="Everything sent to the model. Budget = context length minus the response reserve." />
        <div class="hint" style=${{ margin: '2px 0 8px' }}>
          ${src} counts · ctx ${manifest.contextLength} − ${manifest.reserve} reserve
        </div>
        ${manifest.warnings.map((w, i) => html`<div class="warn" key=${i}>⚠\uFE0E ${w}</div>`)}
      <//>
      <${InspectorSection} title="Lore injected" count=${L.lore.pieces.length}>
        ${L.lore.pieces.length === 0 && html`<div class="hint">No lore pieces active.</div>`}
        ${L.lore.pieces.map(p => html`
          <${InspectorRow} key=${p.id}
            pills=${[{ text: p.reason, cls: p.reason },
              ...(p.origin === 'chat' ? [{ text: 'chat', cls: 'chat' }] : []),
              ...(p.origin === 'character' ? [{ text: 'character', cls: 'character' }] : []),
              ...(p.boost > 0 && p.reason !== 'link-boosted' ? [{ text: `+${p.boost} boost`, cls: 'link-boosted' }] : []),
              ...semPill(p.id, true)]}
            title=${p.title} meta=${`w${p.weight} · ${p.tokens}t`}
            preview=${p.preview} content=${p.content} />`)}
        ${(L.lore.inactive ?? []).length > 0 && html`
          <div class="hint ir-toggle" onClick=${() => setShowInactive(!showInactive)}>
            Not injected (${L.lore.inactive.length}) ${showInactive ? '▾' : '▸'}
          </div>
          ${showInactive && L.lore.inactive.map((p, i) => html`
            <${InspectorRow} key=${p.id ?? i} dimmed
              pills=${[{ text: p.reason, cls: p.reason === 'over-budget' ? 'pinned' : '' },
                ...(p.origin === 'chat' ? [{ text: 'chat', cls: 'chat' }] : []),
                ...(p.origin === 'character' ? [{ text: 'character', cls: 'character' }] : []),
                ...semPill(p.id, false)]}
              title=${p.title} meta=${`${p.tokens}t`}
              preview=${p.preview} content=${p.content} />`)}`}
      <//>
      ${queueSection}
      <${InspectorSection} title="Memories injected" count=${L.memory.memories.length}>
        ${L.memory.memories.length === 0 && html`<div class="hint">No memories injected.</div>`}
        ${L.memory.memories.map((m, i) => html`
          <${InspectorRow} key=${m.id ?? i}
            pills=${[...(m.pinned ? [{ text: 'pinned', cls: 'pinned' }] : [{ text: m.reason ?? 'recent', cls: m.reason === 'semantic' ? 'semantic' : '' }]),
              ...(m.score != null && (m.reason === 'semantic') ? [{ text: `sim ${m.score.toFixed(2)}`, cls: 'semantic' }] : [])]}
            title=${`memory ${String(m.id ?? '').slice(-6)}`} meta=${`${m.tokens}t`}
            preview=${m.preview} content=${m.text} />`)}
        ${(L.memory.inactive ?? []).length > 0 && html`
          <div class="hint ir-toggle" onClick=${() => setShowInactiveMem(!showInactiveMem)}>
            Not injected (${L.memory.inactive.length}) ${showInactiveMem ? '▾' : '▸'}
          </div>
          ${showInactiveMem && L.memory.inactive.map((m, i) => html`
            <${InspectorRow} key=${m.id ?? i} dimmed
              pills=${[{ text: m.reason, cls: m.reason === 'below-threshold' ? '' : 'pinned' },
                ...(m.score != null && m.reason === 'below-threshold' ? [{ text: `sim ${m.score.toFixed(2)}`, cls: '' }] : [])]}
              title=${`memory ${String(m.id ?? '').slice(-6)}`} meta=${`${m.tokens}t`}
              preview=${m.preview} content=${m.text} />`)}`}
      <//>
      ${auxSection}
      ${(manifest.toolCalls ?? []).length > 0 && html`
        <${InspectorSection} title="Tool calls" count=${manifest.toolCalls.length}>
          ${manifest.toolCalls.map((t, i) => html`
            <${InspectorRow} key=${i} dimmed=${!t.ok}
              pills=${[{ text: t.ok ? 'ok' : 'failed', cls: t.ok ? 'ok' : 'pinned' }]}
              title=${t.name || '(unparsed)'} meta=${t.note}
              preview=${toPreview(t.args, 140)} content=${t.args} />`)}
        <//>`}
      ${hasChat && html`<button class="btn" style=${{ marginTop: '8px' }} onClick=${() => onPreview()}>Re-run assembler on current chat</button>`}
    </div>`;
}

// ============================================================================
// COMPONENTS: MEMORY PANEL — view / pin / delete memories, manual summarize.
// ============================================================================
function MemoryPanel({ chat, onUpdateChat, onSummarize, summarizing, dateFormat, memoryEvery, cap }) {
  const [hi, setHi] = useState(null); // card id flashed by a supersede-badge jump
  if (!chat) return html`<div class="hint">Select a chat to see its memories.</div>`;
  const memories = [...(chat.memoryStore?.memories ?? [])].sort((a, b) => b.createdAt - a.createdAt);
  const setStore = (mems) => onUpdateChat({ ...chat, memoryStore: { ...chat.memoryStore, memories: mems } }, { touch: false });
  // Superseded badge → scroll to the replacement card and flash its border.
  const jumpTo = (id) => {
    setHi(id);
    if (typeof document !== 'undefined')
      document.getElementById(`mem-${id}`)?.scrollIntoView({ block: 'center', behavior: 'smooth' });
  };
  // Restore a superseded card: drop the supersede marks so the note shows
  // again on branches where the supersede point had hidden it. The newer
  // replacement card is untouched.
  const restore = (m) => setStore(chat.memoryStore.memories.map(x => {
    if (x.id !== m.id) return x;
    const { supBy, supAtMsgs, supAtMsg, ...rest } = x;
    return rest;
  }));
  return html`
    <div>
      <div style=${{ display: 'flex', gap: '6px', alignItems: 'center', marginBottom: '8px' }}>
        <span class="hint" style=${{ flex: 1 }}>
          ${memories.length}/${cap ?? MEMORY_CAP} memories · auto-summary every ${memoryEvery ?? MEMORY_EVERY} messages
        </span>
        <button class="btn small" disabled=${summarizing} onClick=${() => onSummarize()}>
          ${summarizing ? 'Summarizing…' : 'Summarize now'}</button>
      </div>
      ${memories.length === 0 && html`<div class="hint">No memories yet. They are created automatically as the chat grows, and are versioned with the chat (branches fork them, rewinds roll them back).</div>`}
      ${memories.map(m => html`
        <div class="mem-item ${hi === m.id ? 'hi' : ''}" key=${m.id} id=${`mem-${m.id}`}>
          <div class="row">
            ${m.pinned && !m.supBy && html`<span class="pill pinned">pinned</span>`}
            ${m.supBy && html`<span class="pill" role="button" style=${{ cursor: 'pointer' }}
              title="Revised by the lore pass — hidden from context on branches past the revision point; the original text is kept for rewind and older branches. Click to jump to the replacement."
              onClick=${() => jumpTo(m.supBy)}>superseded</span>`}
            <span class="hint" style=${{ flex: 1 }}>${fmtDate(m.createdAt, dateFormat)}</span>
            ${!m.supBy && html`<button class="btn small" onClick=${() => setStore(chat.memoryStore.memories.map(x => x.id === m.id ? { ...x, pinned: !x.pinned } : x))}>
              ${m.pinned ? 'unpin' : 'pin'}</button>`}
            ${m.supBy && html`<button class="btn small" title="Clear the supersede marks — this note shows again where the revision had hidden it"
              onClick=${() => restore(m)}>restore</button>`}
            <button class="btn small danger" title="Delete memory" onClick=${() => setStore(chat.memoryStore.memories.filter(x => x.id !== m.id))}>✕</button>
          </div>
          <div class="text">${m.text}</div>
          ${m.revNote && html`<div class="hint" style=${{ marginTop: '4px' }}
            title="Change summary recorded by the maintenance pass">change: ${m.revNote}</div>`}
        </div>`)}
    </div>`;
}
// ============================================================================
// COMPONENTS: CHAT OPTIONS TAB — per-chat settings.
// ============================================================================
function ChatOptions({ chat, personas, scenario, characters, onUpdateChat, onExport, onDelete, onGenerate, onOpenBranches, onGenerateAvatar = null, onExportPiece = null, cap = null, memMaxChars = null, dateFormat = null, onRunMaintenance = null }) {
  const [editing, setEditing] = useState(null); // { piece, isNew } | null — lore piece editor popout
  const [histOpen, setHistOpen] = useState(false); // maintenance history modal
  if (!chat) return html`<div class="hint">Select a chat first.</div>`;
  const pieces = Array.isArray(chat.lorePieces) ? chat.lorePieces : [];
  // Pieces are never deleted by rewind/regenerate — a piece stamped with a
  // node/swipe off the active view belongs to a sibling branch or a replaced
  // take and hides by derivation. It still renders here, marked, so the chat
  // tab can never silently lose a chat-registered character.
  const pathIds = pathIdSet(chat.messages ?? {}, chat.activeLeafId);
  const offBranch = (p) => !pieceVisibleAt(p, pathIds, chat.messages ?? null);
  const allPieces = mergedLorePieces(scenario, chat, characters);
  const linkedChars = resolveCharacters(scenario, chat, characters);
  const setPieces = (lorePieces) => update({ ...chat, lorePieces });
  // Queue accept routing: new pieces become user-owned (provenance stripped,
  // visible on every branch); UPDATE proposals keep their stamps (a rewrite
  // must stay scoped to the branch that accepted it); memory revisions land
  // as a fresh card superseding the stale one. One pure step against a
  // working chat so Accept all can fold the whole queue through it.
  const acceptStep = (work, q) => {
    const path = getActivePath(work.messages ?? {}, work.activeLeafId);
    if (q.kind === 'memory')
      return acceptQueuedMemory(work, q.id, { atLen: path.length,
        atMsg: work.activeLeafId ?? null, cap: cap ?? MEMORY_CAP,
        maxChars: memMaxChars ?? DEFAULT_SETTINGS.memoryMaxChars });
    if (q.updateOf) {
      const ids = pathIdSet(work.messages ?? {}, work.activeLeafId);
      const view = mergedLorePieces(scenario, work, characters)
        .filter(p => pieceVisibleAt(p, ids, work.messages ?? null))
        .map(p => pieceAtPath(p, ids, work.messages ?? null));
      return acceptQueuedUpdate(work, q.id, { allPieces: view,
        nodeId: work.activeLeafId ?? null, atLen: path.length,
        createdSwipe: work.messages?.[work.activeLeafId]?.activeSwipe ?? null });
    }
    return acceptQueuedLore(work, q.id);
  };
  const acceptQueued = (q) => update(acceptStep(chat, q));
  const acceptAll = () => update((chat.loreQueue ?? []).reduce(acceptStep, chat));
  const dismissAll = () => {
    if (confirm(`Dismiss all ${chat.loreQueue.length} pending proposals?`))
      update({ ...chat, loreQueue: [] });
  };
  // Metadata edits (name, persona, lore, notes) don't touch the message tree —
  // touch:false keeps them from bumping updatedAt and re-sorting the sidebar.
  const update = (c) => onUpdateChat(c, { touch: false });
  return html`
    <div>
      <label class="field"><span>Chat name</span>
        <input type="text" value=${chat.name} onInput=${(e) => update({ ...chat, name: e.target.value })} /></label>
      <label class="field"><span>Persona ({{user}})</span>
        <select value=${chat.personaId ?? ''} onChange=${(e) => update({ ...chat, personaId: e.target.value || null })}>
          <option value="">— none ({{user}} → "User") —</option>
          ${Object.values(personas).sort((a, b) => a.name.localeCompare(b.name)).map(p => html`<option key=${p.id} value=${p.id}>${p.name}</option>`)}
        </select></label>
      <label class="field"><span>Model override (this chat only; blank = global chat model)</span>
        <input type="text" value=${chat.settings?.model ?? ''} placeholder="(global)"
          onInput=${(e) => update({ ...chat, settings: { ...(chat.settings ?? {}), model: e.target.value.trim() || undefined } })} /></label>
      ${linkedChars.length > 0 && html`
        <div class="hint">Linked characters (global cards — edits apply live everywhere): ${linkedChars.map(p => p.title).join(', ')}</div>`}
      <label class="field"><span>Custom instructions — appended to the system layer for this chat only</span>
        <textarea rows=${4} value=${chat.customInstructions ?? ''}
          onInput=${(e) => update({ ...chat, customInstructions: e.target.value })} /></label>
      <label class="field"><span>Author's note — sticky steering injected after custom instructions</span>
        <textarea rows=${2} value=${chat.authorsNote ?? ''}
          onInput=${(e) => update({ ...chat, authorsNote: e.target.value })} /></label>
      ${Object.keys(chat.vars ?? {}).length > 0 && html`
        <div class="hint">Story variables (usable as {{var:name}}): ${Object.entries(chat.vars).map(([k, v]) => `${k} = ${v}`).join(' · ')}</div>`}
      ${(chat.loreQueue ?? []).length > 0 && html`
        <div class="field">
          <span>Suggested lore — awaiting review (${chat.loreQueue.length})</span>
          <div class="hint">Proposed by the model or the maintenance pass. Accept moves a new piece into this chat's lore as yours; an update rewrites the named piece for this chat only (the original card is kept, and rewind restores it); a memory revision replaces the stale note going forward. Dismiss discards the proposal.</div>
          ${chat.loreQueue.length > 1 && html`
            <div style=${{ display: 'flex', gap: '6px', marginBottom: '6px' }}>
              <button class="btn small" title="Accept every pending proposal (same rules as accepting one by one)" onClick=${acceptAll}>Accept all</button>
              <button class="btn small danger" title="Discard every pending proposal" onClick=${dismissAll}>Dismiss all</button>
            </div>`}
          ${chat.loreQueue.map(q => html`
            <div class="lore-card" key=${q.id}>
              <div class="lc-head">
                <span class="t">${q.title || '(untitled)'}</span>
                <span class="pill">${queuePillOf(q)}</span>
                <button class="btn small" onClick=${() => acceptQueued(q)}>accept</button>
                <button class="btn small danger" title="Dismiss proposal" onClick=${() => update(dismissQueuedLore(chat, q.id))}>✕</button>
              </div>
              ${q.note && html`<div class="hint" style=${{ padding: '2px 8px 0' }}>change: ${q.note}</div>`}
              ${q.oldContent != null ? html`
                <div class="grid2" style=${{ padding: '2px 8px 6px' }}>
                  <div class="hint" style=${{ whiteSpace: 'pre-wrap' }}>was: ${q.oldContent.slice(0, 400)}${q.oldContent.length > 400 ? '…' : ''}</div>
                  <div class="hint" style=${{ whiteSpace: 'pre-wrap' }}>now: ${q.content}</div>
                </div>` : html`
                <div class="hint" style=${{ padding: '2px 8px 6px', whiteSpace: 'pre-wrap' }}>${q.content}</div>`}
              ${(q.keys ?? []).length > 0 && html`
                <div class="hint" style=${{ padding: '0 8px 6px' }}>keys: ${q.keys.join(', ')}</div>`}
            </div>`)}
        </div>`}
      <div class="field">
        <span>Lore — this chat only (${pieces.length})
          <button class="btn small" style=${{ marginLeft: '8px' }}
            onClick=${() => setEditing({ piece: newLorePiece(), isNew: true })}>+ add piece</button>
          ${LORE_TEMPLATES.map(t => html`
            <button key=${t.label} class="btn small" style=${{ marginLeft: '4px' }}
              title=${`New ${t.label} piece, prefilled with a skeleton`}
              onClick=${() => setEditing({ piece: newLoreFromTemplate(t), isNew: true })}>+ ${t.label}</button>`)}
        </span>
        <div class="hint">Merged over the scenario's lore at generation time (chat wins on a shared id). Characters added here join speaker colours, /pov, and semantic activation for this chat only. Click a piece to edit or ✦ generate it.</div>
        ${pieces.map(p => html`
          <div class="lore-card" key=${p.id}>
            <div class="lc-head" title="Edit piece" onClick=${() => setEditing({ piece: p, isNew: false })}>
              <span class="t">${p.title || '(untitled)'}</span>
              ${p.type === 'character' && html`<span class="pill">character</span>`}
              ${p.pinned && html`<span class="pill pinned">pinned</span>`}
              ${p.enabled === false && html`<span class="pill">disabled</span>`}
              ${offBranch(p) && html`<span class="pill" title="Belongs to another branch or a replaced swipe — hidden from context until you switch back to it">branch</span>`}
              ${p.type === 'character' && onExportPiece && html`
                <button class="btn small" title="Export as a global character — appears in the sidebar's Characters section"
                  onClick=${(e) => { e.stopPropagation(); onExportPiece(p); }}>⇪${'\uFE0E'}</button>`}
              <button class="btn small danger" title="Remove from this chat"
                onClick=${(e) => { e.stopPropagation(); setPieces(pieces.filter(q => q.id !== p.id)); }}>✕</button>
            </div>
          </div>`)}
      </div>
      <div style=${{ display: 'flex', gap: '6px', flexWrap: 'wrap' }}>
        ${onRunMaintenance && scenario?.emergentLore !== 'off' && html`
          <button class="btn small" title="Run the lore maintenance pass now (bypasses the cadence gate; no-op while a generation or aux call is busy)"
            onClick=${() => onRunMaintenance()}>✦ Run maintenance now</button>`}
        ${onOpenBranches && html`<button class="btn small" title="See every branch of this chat and jump between them" onClick=${() => onOpenBranches()}>⎇ Branches</button>`}
        <button class="btn small" title="Change log of maintenance writes — piece updates, tool registrations, memory revisions"
          onClick=${() => setHistOpen(true)}>Maintenance history</button>
        <button class="btn small" onClick=${() => onExport()}>Export chat JSON</button>
        <button class="btn small danger" onClick=${() => onDelete()}>Delete chat</button>
      </div>
      ${editing && html`
        <${LorePieceEditor} piece=${editing.piece} isNew=${editing.isNew} allPieces=${allPieces}
          onSave=${(draft) => {
            if (editing.isNew) { setPieces([...pieces, draft]); setEditing(null); return; }
            // Merge-on-save: re-read the LIVE piece — a generation completing
            // while the popout was open may have appended stamped revisions
            // (tool update, lore pass, enrichment), and wholesale replacement
            // would wipe a log that is never trimmed. The draft wins the
            // editable fields; the live piece's revision log and provenance
            // stamps survive. A piece deleted meanwhile drops the save.
            const live = pieces.find(q => q.id === draft.id);
            if (!live) { setEditing(null); return; }
            const merged = { ...draft,
              ...(live.revisions ? { revisions: live.revisions } : {}),
              ...Object.fromEntries(['createdAt', 'createdBy', 'createdSwipe', 'atLen']
                .filter(k => live[k] !== undefined).map(k => [k, live[k]])) };
            setPieces(pieces.map(q => q.id === draft.id ? merged : q));
            setEditing(null);
          }}
          onClose=${() => setEditing(null)} onGenerate=${onGenerate} onGenerateAvatar=${onGenerateAvatar} />`}
      ${histOpen && html`<${MaintenanceHistoryModal} chat=${chat} dateFormat=${dateFormat} onClose=${() => setHistOpen(false)} />`}
    </div>`;
}

// ============================================================================
// COMPONENTS: CHAT SAMPLERS TAB — per-chat sampler + generation overrides,
// with the global defaults editable in place (the toggle swaps the pane).
// A knob is sent only while checked: per-chat rows override the global value
// for this chat's generations; global rows mirror Settings → Generation.
// ============================================================================
// Generation-length knobs shown in BOTH Samplers pane views (per-chat rows
// override, global rows edit directly) — keeps the two views in the same order.
const GEN_LENGTH_FIELDS = [
  { key: 'contextLength', label: 'Context length (tokens)', type: 'number', min: 256, step: 512, def: DEFAULT_SETTINGS.contextLength },
  { key: 'maxTokens', label: 'Response max tokens', type: 'number', min: 1, step: 50, def: DEFAULT_SETTINGS.maxTokens },
];

function ChatSamplers({ chat, settings, onUpdateChat, onUpdateSettings }) {
  const [globalEdit, setGlobalEdit] = useState(false);
  if (!chat) return html`<div class="hint">Select a chat first.</div>`;
  const global = settings?.samplers ?? {};
  const overrides = chat.settings?.samplers ?? {};
  const fields = allSamplerFields(settings);
  // touch:false — sampler tweaks are metadata, not narrative edits; don't
  // bump updatedAt and re-sort the sidebar.
  const putChatSettings = (patch) =>
    onUpdateChat({ ...chat, settings: { ...(chat.settings ?? {}), ...patch } }, { touch: false });
  const setGlobal = (k, v) => onUpdateSettings({ samplers: { ...global, [k]: v } });
  // Disable ≠ delete: value stays in settings.samplers, key joins
  // disabledSamplers; re-enabling restores it.
  const toggleGlobal = (f, on) => {
    const disabledSamplers = (settings?.disabledSamplers ?? []).filter(k => k !== f.key);
    if (!on) disabledSamplers.push(f.key);
    const samplers = { ...global };
    if (on && samplers[f.key] == null) samplers[f.key] = f.def;
    onUpdateSettings({ samplers, disabledSamplers });
  };
  // What the global side would actually send (disabled keys excluded) — the
  // per-chat rows display these as the inherited values.
  const globalSent = enabledSamplers(settings);
  return html`
    <div>
      <div class="ptabs" style=${{ margin: '-4px 0 8px', padding: 0 }}>
        <button class=${globalEdit ? '' : 'active'} onClick=${() => setGlobalEdit(false)}>This chat</button>
        <button class=${globalEdit ? 'active' : ''} onClick=${() => setGlobalEdit(true)}>Global defaults</button>
      </div>
      ${globalEdit ? html`
        ${GEN_LENGTH_FIELDS.map(f => html`
          <div class="sampler-row" key=${f.key}>
            <label class="check">${f.label}</label>
            <span class="sval">
              ${samplerValueCtl(f, settings?.[f.key] ?? f.def, (v) => onUpdateSettings({ [f.key]: v }))}
            </span>
          </div>`)}
        ${fields.map(f => {
          const active = global[f.key] != null && !(settings?.disabledSamplers ?? []).includes(f.key);
          return html`
            <div class="sampler-row" key=${f.key}>
              <label class="check">
                <input type="checkbox" checked=${active} onChange=${(e) => toggleGlobal(f, e.target.checked)} />
                ${f.label}${f.custom ? ' ✦' : ''}</label>
              <span class="sval">
                ${active
                  ? samplerValueCtl(f, global[f.key], (v) => setGlobal(f.key, v))
                  : html`<span class="hint">${global[f.key] != null ? String(global[f.key]) : '—'}</span>`}
              </span>
            </div>`;
        })}
        <div class="hint" style=${{ marginTop: '8px' }}>Editing the global samplers (Settings → Generation). Unchecked params aren't sent — the backend default applies; values are kept.</div>` : html`
        ${GEN_LENGTH_FIELDS.map(f => {
          const on = chat.settings?.[f.key] != null;
          const eff = on ? chat.settings[f.key] : settings?.[f.key];
          return html`
            <div class="sampler-row" key=${f.key}>
              <label class="check">
                <input type="checkbox" checked=${on}
                  onChange=${(e) => putChatSettings({ [f.key]: e.target.checked ? (eff ?? f.def) : undefined })} />
                ${f.label}</label>
              <span class="sval">
                ${on
                  ? samplerValueCtl(f, chat.settings[f.key], (v) => putChatSettings({ [f.key]: v }))
                  : html`<span class="hint">global: ${eff ?? f.def}</span>`}
              </span>
            </div>`;
        })}
        ${(() => {
          const offered = fields.filter(f => (settings?.samplerFields ?? []).includes(f.key));
          if (!offered.length) return html`<div class="hint">No per-chat sampler knobs enabled — pick them in Settings → Generation.</div>`;
          return offered.map(f => {
            const on = overrides[f.key] != null;
            const eff = on ? overrides[f.key] : globalSent[f.key];
            return html`
              <div class="sampler-row" key=${f.key}>
                <label class="check">
                  <input type="checkbox" checked=${on}
                    onChange=${(e) => {
                      const samplers = { ...overrides };
                      if (e.target.checked) samplers[f.key] = global[f.key] ?? f.def;
                      else delete samplers[f.key];
                      putChatSettings({ samplers });
                    }} />
                  ${f.label}${f.custom ? ' ✦' : ''}</label>
                <span class="sval">
                  ${on
                    ? samplerValueCtl(f, overrides[f.key], (v) => putChatSettings({ samplers: { ...overrides, [f.key]: v } }))
                    : html`<span class="hint">${eff != null ? `global: ${eff}` : 'backend default'}</span>`}
                </span>
              </div>`;
          });
        })()}
        <div class="hint" style=${{ marginTop: '8px' }}>Checked knobs override the global value for this chat only. Sampler knobs are picked in Settings → Generation; context length and max tokens are always available.</div>`}
    </div>`;
}

// ============================================================================
// COMPONENTS: MESSAGE + COMPOSER + CHAT PANE
// ============================================================================
// ============================================================================
// COMPONENTS: PROBS VIEW — per-token spans with probability tint + hover
// popover (top-10 alternatives, click to branch generation from that token).
// ============================================================================
const visibleTok = (t) => String(t ?? '').replace(/ /g, '␣').replace(/\t/g, '⇥').replace(/\n/g, '↵\n');
const probPct = (lp) => lp == null ? null : Math.exp(lp) * 100;
// Adaptive precision: near-degenerate distributions (e.g. post-thinking
// replies, where the answer is ~decided) all round to 100.0%/0.0% at 1
// decimal and the view looks broken. Show more digits near the extremes.
const fmtPct = (pct) => pct == null ? null
  : pct >= 99.95 ? pct.toFixed(3) + '%'
  : pct >= 99.5 ? pct.toFixed(2) + '%'
  : pct > 0 && pct < 0.1 ? '<0.1%'
  : pct.toFixed(1) + '%';

function ProbsView({ tokens, onPick }) {
  return html`
    <div class="probs-view">
      ${tokens.map((t, i) => {
        if (t.logprob == null) // no prob data for this chunk: plain span, no popover
          return html`<span key=${i}>${t.text}</span>`;
        const pct = probPct(t.logprob);
        const bg = pct == null ? 'transparent'
          : `color-mix(in oklch, color-mix(in oklch, var(--c-good) ${Math.round(pct)}%, var(--c-danger)) 30%, transparent)`;
        return html`
          <span key=${i} class="tok" style=${{ background: bg }}>${t.text}<span class="pop">
            <div class="pop-row head"><span class="tt">${visibleTok(t.text) || '∅'}</span>
              <span class="pc">${fmtPct(pct) ?? 'n/a'}</span></div>
            ${(t.top ?? []).map((alt, j) => {
              const ap = probPct(alt.logprob);
              return html`<div key=${j} class="pop-row alt" onClick=${() => onPick(i, alt.token)}>
                <span class="rank">#${j + 1}</span><span class="tt">${visibleTok(alt.token)}</span>
                <span class="pc">${fmtPct(ap) ?? ''}</span></div>`;
            })}
            <div class="pop-row alt" onClick=${() => onPick(i, null)}><span class="tt">↻ from here</span></div>
          </span></span>`;
      })}
    </div>`;
}

// Collapsible reasoning box (delta.reasoning_content — vLLM/DeepSeek/etc.).
// Collapsed by default, streaming or not — the header still shows live that
// thinking is in progress ("Thinking…"), and once the stream ends it carries
// the total thinking time (swipe.thinkMs). The expanded body scrolls via
// RailScroll (hidden native scrollbar, accent rail + bottom fade cues).
function ThinkBox({ text, streaming, thinkMs }) {
  const [open, setOpen] = useState(false);
  return html`
    <div class="think">
      <button class="think-head" onClick=${() => setOpen(!open)}>
        <span class="think-caret">${open ? '▾' : '▸'}</span> Thinking${streaming ? '…'
          : Number.isFinite(thinkMs) ? ` - ${(thinkMs / 1000).toFixed(1)}s` : ''}</button>
      ${open && html`<${RailScroll} className="think-body">${text}<//>`}
    </div>`;
}

// One recorded tool call in the gear popover: ✓/✕ + name + note, and the
// args as a one-line preview that expands to the full JSON on click — the
// swipe stores the untruncated args, truncation is display-only here.
function ToolCallRow({ t }) {
  const [open, setOpen] = useState(false);
  const hasArgs = t.args && t.args !== '{}';
  return html`
    <span class="tools-row ${t.ok ? '' : 'failed'}">
      <span>${t.ok ? '✓' : '✕'} <b>${t.name || '(unparsed)'}</b>${t.note ? html`<span class="tools-note"> — ${t.note}</span>` : null}</span>
      ${hasArgs && html`<span class="tools-args" title=${open ? null : 'Click to view the full arguments'}
        onClick=${() => setOpen(!open)}>${open ? t.args : toPreview(t.args, 140)}</span>`}
    </span>`;
}

// Generated-image attachments on a swipe (v4.10): entries group into SLOTS —
// one placement, one or more takes (per-image swipes). A slot renders once:
// the active take (pending → shimmer, error/no src → dim note with the prompt
// on the tooltip, else the image with click-to-zoom via onZoom), with a
// ◀ n/m ▶⁺ navigator UNDER it whenever there is something to flip or re-roll
// (count > 1 || canRegen) — mirroring the message swipe navigator; ▶⁺ on the
// last take re-rolls JUST that image with the same prompt. A horizontal touch
// swipe on the image itself flips takes too (left = next / ▶⁺ on the last,
// right = back). WHERE a slot renders is MessageItem's call (the active
// take's `pos` vs the speaker segments / visible text end): attached INSIDE
// the reply bubble (head or end) or embedded between markdown blocks when
// genuinely mid-text — free-standing only for a scene break between speaker
// bubbles or an image-only swipe (nothing to attach to).
function SwipeImages({ slots, onZoom, generating = false, canRegen = false, onImgSwipe, onImgRegen }) {
  return html`${(slots ?? []).map((sv) => html`
    <${SwipeImage} key=${sv.slot} sv=${sv} onZoom=${onZoom} generating=${generating}
      canRegen=${canRegen} onImgSwipe=${onImgSwipe} onImgRegen=${onImgRegen} />`)}`;
}

// One image slot: the active take plus its take navigator. Owns its touch
// gesture (touch/pen, 70px horizontal-dominant, one action per gesture — the
// message gestureHandlers pattern) on the wrapper: the pointerdown
// stopPropagation keeps image-born gestures from arming the MESSAGE swipe
// handlers on an ancestor bubble. A consumed gesture swallows the trailing
// click (a >70px drag must not open the lightbox).
function SwipeImage({ sv, onZoom, generating, canRegen, onImgSwipe, onImgRegen }) {
  const { take, activeIdx, count, hasPending } = sv;
  const gestureRef = useRef(null);
  const consumedRef = useRef(false);
  const atLast = activeIdx >= count - 1;
  const regen = () => { if (!generating && !hasPending && canRegen) onImgRegen?.(sv.slot); };
  const gestureHandlers = {
    onPointerDown: (e) => {
      if (e.pointerType === 'mouse') return; // mouse never arms the message gesture either
      e.stopPropagation(); // image-born gestures never trigger message swipes
      consumedRef.current = false; // a stale flag must not eat this gesture's click
      gestureRef.current = { id: e.pointerId, x: e.clientX, y: e.clientY };
      try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
    },
    onPointerMove: (e) => {
      const g = gestureRef.current;
      if (!g || g.id !== e.pointerId) return;
      const dx = e.clientX - g.x, dy = e.clientY - g.y;
      if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy)) {
        gestureRef.current = null; // one action per gesture
        consumedRef.current = true; // swallow the click that follows the drag
        if (generating) return; // buttons stand down mid-generation; the gesture matches
        if (dx < 0) { // swipe left: next take, or ▶⁺ re-roll on the last one
          if (!atLast) onImgSwipe?.(sv.slot, 1);
          else regen();
        } else if (activeIdx > 0) { // swipe right: back
          onImgSwipe?.(sv.slot, -1);
        }
      }
    },
    onPointerUp: () => { gestureRef.current = null; },
    onPointerCancel: () => { gestureRef.current = null; },
  };
  return html`
    <div class="swipe-img-wrap" ...${gestureHandlers}>
      ${take?.pending ? html`<div class="img-pending"></div>`
        : take?.error || !take?.src
          ? html`<div class="img-error" title=${typeof take?.error === 'string' ? take.error : take?.prompt ?? ''}>✕\uFE0E image unavailable</div>`
          : html`<img class="swipe-img" src=${take.src} alt=${take.caption || take.prompt || ''}
              onClick=${() => { if (consumedRef.current) { consumedRef.current = false; return; } onZoom?.(take, sv.slot); }} />`}
      ${(count > 1 || canRegen) && html`
        <span class="swipes img-swipes">
          <button class="btn small ghost" title="Previous take" disabled=${generating || activeIdx <= 0}
            onClick=${() => onImgSwipe?.(sv.slot, -1)}>◀\uFE0E</button>
          <span>${activeIdx + 1}/${count}</span>
          ${!atLast
            ? html`<button class="btn small ghost" title="Next take" disabled=${generating}

            </div>
          </div>
          ${imgGroups.get(si) ? freeImg(imgGroups.get(si), `img-${si}`) : null}`;})}` : html`
      ${thinkBubble}
      ${!hideBubble && html`<div class="bubble ${dragX !== 0 ? 'dragging' : ''}"
        style=${{ transform: dragX ? `translateX(${dragX}px)` : null }}
        ...${gestureHandlers}>
        ${!editing && headImgs && swipeImgs(headImgs)}
        ${editing ? html`
          <textarea class="edit" value=${draft} onInput=${(e) => setDraft(e.target.value)} />
          <div style=${{ display: 'flex', gap: '6px' }}>
            <button class="btn small primary" onClick=${() => { onEdit(node.id, draft); setEditing(false); }}>Save</button>
            <button class="btn small" onClick=${() => setEditing(false)}>Cancel</button>
          </div>` :
          streaming && !displayText
            // Generating but no first token yet (slow backend waking up, model
            // loading, middleware holding the connection) — don't look dead.
            ? html`<div class="waiting" title="Waiting for the first token…"><span>●\uFE0E</span><span>●\uFE0E</span><span>●\uFE0E</span></div>` :
          probsShown
            ? html`<${ProbsView} tokens=${swipe.tokens} onPick=${(i, alt) => onRegenFromToken(node.id, i, alt)} />` :
          isOOC
            ? html`<div class="plain ${streaming ? 'streaming-cursor' : ''}">${displayText}</div>` :
          embeds
            // A mid-text image splits the markdown at its block's position —
            // the fence sat on a line boundary, so both halves parse cleanly.
            ? html`${embedParts.map((part, pi) => html`
              ${pi > 0 ? swipeImgs([embeds[pi - 1].sv], `ei${pi}`) : null}
              ${part ? html`<div key=${`ep${pi}`} class=${streaming ? 'streaming-cursor' : ''}><${ThrottledMarkdown} text=${part} prose streaming=${streaming} /></div>` : null}`)}` :
          // Only a user message with nothing but images renders no text block
          // (an assistant image-only swipe skips the bubble entirely).
          displayText || !imgs
            ? html`<div class=${streaming ? 'streaming-cursor' : ''}><${ThrottledMarkdown} text=${displayText} prose streaming=${streaming} /></div>`
            : null}
        ${!editing && tailImgs && swipeImgs(tailImgs)}
      </div>`}
      ${freeImgs ? freeImg(freeImgs, 'img-post') : null}`}
      ${offPathKids.length > 0 && html`
        <div class="branch-chip-row">
          <button class="branch-chip" disabled=${generating}
            title="This message has continuations on other branches — click to compare or switch"
            onClick=${(e) => {
              if (!branchOpen) {
                // Flip up when the popover wouldn't fit below the chip (a
                // truncated pseudo-branch sits at the bottom of the chat).
                const r = e.currentTarget.getBoundingClientRect();
                setBranchUp(window.innerHeight - r.bottom < 300);
              }
              setBranchOpen(!branchOpen);
            }}>⎇ ${offPathKids.length} other ${offPathKids.length === 1 ? 'branch' : 'branches'} from here ${branchOpen ? '▴' : '▾'}</button>
          ${branchOpen && html`
            <span class="tools-pop branch-pop ${branchUp ? 'above' : ''}">
              ${branchKids.map(k => {
                const cur = k.id === childOnPathId;
                const kFrom = k.fromSwipe ?? usedIdx ?? 0;
                return html`
                  <button key=${k.id} class="branch-row ${cur ? 'current' : ''}" disabled=${generating || cur}
                    title=${cur ? 'This is the branch you are on' : 'Switch to this branch'}
                    onClick=${() => { setBranchOpen(false); onJump(k.id); }}>
                    <span class="ct-dot ${k.role}"></span>
                    ${kFrom !== node.activeSwipe && html`<span class="branch-sw">swipe ${kFrom + 1}</span>`}
                    <span class="branch-text">${toPreview(activeText(k), 80) || '(empty)'}</span>
                    ${cur && html`<span class="branch-cur">current</span>`}
                  </button>`;
              })}
              <button class="branch-row branch-tree" onClick=${() => { setBranchOpen(false); onOpenBranches?.(); }}>⎇ View all branches</button>
            </span>`}
        </div>`}
      ${ctxMenu && html`
        <${ContextMenu} x=${ctxMenu.x} y=${ctxMenu.y} onClose=${() => setCtxMenu(null)}
          items=${[
            // Right-click landed on a generated image: image actions first.
            ...(ctxMenu.img ? [
              { label: 'Save image', fn: () => downloadDataURL(ctxMenu.img.src, imageFilename(ctxMenu.img.name, ctxMenu.img.src, ctxMenu.img.num)) },
              { label: 'Expand image', fn: () => {
                  const s = ctxMenu.img.slot != null && slots ? slots.find(v => v.slot === ctxMenu.img.slot) : null;
                  if (s?.take) zoomImg(s.take, s.slot);
                  else setLightbox({ src: ctxMenu.img.src, title: ctxMenu.img.name });
                } },
              '-',
            ] : []),
            ...(hasProbs ? [{ label: 'Token probabilities', fn: () => setShowProbs(!showProbs) }] : []),
            { label: 'Edit', fn: () => { setDraft(swipe.text); setEditing(true); }, disabled: generating },
            isUser
              ? { label: 'Reply from here', fn: () => onReply(node.id), disabled: generating || auxBusy }
              : { label: 'Regenerate (new swipe)', fn: () => onRegenerate(node.id), disabled: generating || auxBusy },
            { label: 'Fork to new chat', fn: () => onBranch(node.id) },
            ...(!isRoot ? [
              '-',
              { label: 'Rewind to here', fn: () => confirm('Rewind the chat to this message? Later messages stay in the tree but leave the active branch; memories are rolled back.') && onRewind(node.id), disabled: generating },
              { label: 'Delete message (and its branch)', fn: () => confirm('Delete this message and everything after it in its branch?') && onDelete(node.id), danger: true, disabled: generating },
            ] : []),
          ]} />`}<//>`;
  return html`
    <div class="msg ${isUser ? 'user' : 'assistant'} ${isOOC ? 'ooc' : ''} ${selected ? 'kbdsel' : ''} ${avatarsOn ? 'with-av' : ''}" data-mid=${node.id}
      onContextMenu=${(e) => {
        // Keep the native menu when the user has text selected (copy etc.).
        if (window.getSelection()?.toString()) return;
        e.preventDefault();
        // A right-click on a generated image carries the image target along,
        // so the menu can offer Save/Expand for it. The slot id + take number
        // (when the click-time src still matches a live take) keep Expand on
        // the live take-tracking lightbox path and suffix the saved filename.
        const imgEl = e.target.closest?.('img.swipe-img') ?? null;
        const imgSv = imgEl ? slots?.find(s => s.take?.src === imgEl.src) ?? null : null;
        setCtxMenu({ x: e.clientX, y: e.clientY,
          img: imgEl ? { src: imgEl.src, name: imgEl.alt || '', slot: imgSv?.slot ?? null,
            num: imgSv ? imgSv.activeIdx + 1 : 0 } : null });
      }}>
      ${avatarsOn && html`
        <div class="msg-av">
          ${!(multi && !editing && !probsShown) && (av?.src || avTile) && html`
            <${Avatar} name=${avName ?? ''} src=${av?.src ?? ''} size=${40}
              onClick=${av?.src ? () => setLightbox({ src: av.full, title: avName }) : null} />`}
        </div>`}
      ${avatarsOn ? html`<div class="msg-body">${body}</div>` : body}
      ${lightbox && lbSrc && html`<${Lightbox} src=${lbSrc}
        title=${lbSlot ? (lbSlot.take?.caption || lbSlot.take?.prompt || '') : lightbox.title}
        num=${lbSlot ? lbSlot.activeIdx + 1 : 0}
        takes=${lbSlot ? lbSlot.takeUrls : null}
        onClose=${() => setLightbox(null)}
        ...${lbSlot && lbSlot.count > 1 ? {
          onPrev: lbSlot.activeIdx > 0 ? () => imgSlotSwipe(lbSlot.slot, -1) : null,
          onNext: lbSlot.activeIdx < lbSlot.count - 1 ? () => imgSlotSwipe(lbSlot.slot, 1) : null,
          pos: `${lbSlot.activeIdx + 1}/${lbSlot.count}`,
        } : {}} />`}
    </div>`;
}

// Streaming markdown throttle: re-parsing the whole accumulated reply with
// marked on every token is O(n²) on the main thread. While `streaming`, the
// rendered text flushes at most once per ~50ms (the latest text is always kept
// in a ref); when streaming ends the exact full text renders immediately via
// the direct path. Non-streaming messages are never throttled.
function ThrottledMarkdown({ text, prose = false, streaming = false }) {
  const [shown, setShown] = useState(text);
  const latestRef = useRef(text);
  latestRef.current = text;
  useEffect(() => {
    if (!streaming) return; // settled: the exact text renders via the direct path
    setShown(latestRef.current); // stream (re)started: sync once, then tick
    const iv = setInterval(() => setShown(s => (s === latestRef.current ? s : latestRef.current)), 50);
    return () => clearInterval(iv);
  }, [streaming]);
  return html`<${Markdown} text=${streaming ? shown : text} prose=${prose} streaming=${streaming} />`;
}

// Memoized MessageItem: the chat pane re-renders the whole message list per
// streamed token, but the other messages don't change. The action callbacks
// from App get fresh identities every render — they are behaviourally stable
// (they read live state via ref.current; the only render-scope capture is
// ui.chatId, and a chat switch always changes the node identities as well), so
// a props-equal that compares everything except functions is safe here.
const MessageItemMemo = React.memo(MessageItem, (a, b) => {
  for (const k in a) {
    if (typeof a[k] === 'function' && typeof b[k] === 'function') continue;
    if (a[k] !== b[k]) return false;
  }
  return true;
});


// ============================================================================
// COMPONENTS: BRANCH PANEL — the message graph condensed to its branch
// structure. Single-child runs collapse into one segment ("#start · preview ·
// N msg"), so long chats render a handful of items, not one per message; only
// branch points (≥ 2 children) fork, and swipe alternatives that nothing
// continues from don't appear (those stay inline-arrow territory).
// Two renderings: the indent-guided outline (default — degenerates the most
// gracefully) and a sparse top-down graph (fork depth grows downward —
// mouse-wheel friendly — with SVG bezier edges on a fixed grid, no library),
// swapped via the Graph/Outline toggle. Active path highlighted, leaf marked,
// click = switch.
// ============================================================================
function BranchPanel({ chat, personaName = 'User', generating = false, onJump }) {
  const messages = chat.messages ?? {};
  const kidsOf = new Map();
  const roots = [];
  for (const n of Object.values(messages)) {
    if (!n) continue;
    if (n.parentId && messages[n.parentId]) {
      if (!kidsOf.has(n.parentId)) kidsOf.set(n.parentId, []);
      kidsOf.get(n.parentId).push(n);
    } else roots.push(n);
  }
  const byAge = (a, b) => ((a.swipes?.[0]?.createdAt ?? 0) - (b.swipes?.[0]?.createdAt ?? 0)) || (a.id < b.id ? -1 : 1);
  for (const kids of kidsOf.values()) kids.sort(byAge);
  roots.sort(byAge);
  const activeIds = pathIdSet(messages, chat.activeLeafId);
  // swipe tag for a branch, only when the siblings continue DIFFERENT parent
  // swipes (same-swipe siblings need no disambiguation).
  const swipeTagOf = (kid, kids) => {
    const parent = messages[kid.parentId];
    if ((parent?.swipes?.length ?? 1) < 2) return null;
    const froms = new Set(kids.map(k => k.fromSwipe ?? parent?.usedSwipe ?? 0));
    return froms.size > 1 ? `swipe ${(kid.fromSwipe ?? parent?.usedSwipe ?? 0) + 1}` : null;
  };
  // Condensed segments, shared by both renderers. `num` is the segment's
  // 1-based message position (root = 1, like the chat log's # meta) so a
  // branch forking at #78 vs #108 reads correctly at a glance.
  const rendered = new Set(); // cycle guard (crafted imports)
  const segs = [];
  const buildSeg = (start, depth, swipeTag) => {
    if (rendered.has(start.id)) return null;
    const chain = [start];
    const seen = new Set([start.id]);
    let end = start;
    while ((kidsOf.get(end.id) ?? []).length === 1) {
      const nxt = kidsOf.get(end.id)[0];
      if (seen.has(nxt.id)) break;
      seen.add(nxt.id);
      end = nxt;
      chain.push(nxt);
    }
    for (const n of chain) rendered.add(n.id);
    const kids = kidsOf.get(end.id) ?? [];
    const seg = {
      id: start.id, start, chain, depth, swipeTag,
      num: getActivePath(messages, start.id).length,
      onPath: chain.some(n => activeIds.has(n.id)),
      hasLeaf: chain.some(n => n.id === chat.activeLeafId),
      kids: [],
    };
    segs.push(seg);
    if (kids.length > 1)
      seg.kids = kids.map(k => buildSeg(k, depth + 1, swipeTagOf(k, kids))).filter(Boolean);
    return seg;
  };
  const segRoots = roots.map(r => buildSeg(r, 0, null)).filter(Boolean);
  const branchPoints = segs.reduce((n, s) => n + (s.kids.length > 1 ? 1 : 0), 0);
  // View toggle: outline is the default everywhere (it degenerates the most
  // gracefully); the user can flip to the sparse graph per opening.
  const [viewPref, setViewPref] = useState(null); // null = default
  const mode = viewPref ?? 'outline';
  const hint = html`
    <div class="hint bview-head">
      <span>
        ${Object.keys(messages).length} messages · ${branchPoints} branch ${branchPoints === 1 ? 'point' : 'points'}.
        ${branchPoints === 0
          ? 'No branches yet — swiping or regenerating a message mid-chat keeps the old continuation as a branch here.'
          : 'Each item is a run of messages starting at the # shown; forks are alternative continuations. The highlighted chain is what you are looking at — click to switch to it. Nothing is deleted — branches just leave the active path.'}
      </span>
      ${roots.length > 0 && html`
        <span class="bview-toggle">
          <button class="btn small ghost ${mode === 'graph' ? 'active' : ''}" onClick=${() => setViewPref('graph')}>Graph</button>
          <button class="btn small ghost ${mode === 'outline' ? 'active' : ''}" onClick=${() => setViewPref('outline')}>Outline</button>
        </span>`}
    </div>`;
  if (roots.length === 0) return html`<div>${hint}<div class="hint">No messages yet.</div></div>`;

  // ---- sparse graph rendering (top-down: fork depth grows downward with
  // the scroll wheel, tips spread across columns) ----
  if (mode === 'graph') {
    const COL_W = 164, ROW_H = 56, NODE_W = 148, NODE_H = 44, PAD = 10;
    // Column layout: the oldest continuation keeps the parent's column, so
    // the mainline reads as one straight vertical line; each further sibling
    // starts a fresh column to the right, spaced by its subtree's tip count.
    // (Parent-centered tidy layouts strand whole columns of empty space.)
    const widthOf = (seg) => seg.kids.length ? seg.kids.reduce((w, k) => w + widthOf(k), 0) : 1;
    const xOf = new Map(); // segment → column
    const place = (seg, col) => {
      xOf.set(seg.id, col);
      let c = col;
      for (const kid of seg.kids) { place(kid, c); c += widthOf(kid); }
    };
    let colCount = 0;
    for (const r of segRoots) { place(r, colCount); colCount += widthOf(r); }
    const maxDepth = segs.reduce((d, s) => Math.max(d, s.depth), 0);
    const width = PAD * 2 + Math.max(1, colCount) * COL_W;
    const height = PAD * 2 + (maxDepth + 1) * ROW_H;
    const posOf = (seg) => ({
      x: PAD + xOf.get(seg.id) * COL_W + (COL_W - NODE_W) / 2,
      y: PAD + seg.depth * ROW_H,
    });
    const edges = [];
    for (const seg of segs) for (const kid of seg.kids) {
      const a = posOf(seg), b = posOf(kid);
      const x1 = a.x + NODE_W / 2, y1 = a.y + NODE_H, x2 = b.x + NODE_W / 2, y2 = b.y;
      edges.push({ x1, y1, x2, y2, active: seg.onPath && kid.onPath, key: `${seg.id}>${kid.id}` });
    }
    return html`
      <div>${hint}
        <div class="bgraph-wrap">
          <div class="bgraph" style=${{ width: `${width}px`, height: `${height}px` }}>
            <svg class="bgraph-edges" width=${width} height=${height}>
              ${edges.map(e => html`<path key=${e.key} class=${e.active ? 'active' : ''}
                d=${`M ${e.x1} ${e.y1} C ${e.x1} ${e.y1 + 22}, ${e.x2} ${e.y2 - 22}, ${e.x2} ${e.y2}`} />`)}
            </svg>
            ${segs.map(seg => {
              const p = posOf(seg);
              return html`
                <button key=${seg.id} class="bg-node ${seg.onPath ? 'active' : ''} ${seg.hasLeaf ? 'leaf' : ''}"
                  style=${{ left: `${p.x}px`, top: `${p.y}px`, width: `${NODE_W}px`, minHeight: `${NODE_H}px` }}
                  disabled=${generating}
                  title=${generating ? 'Wait for the generation to finish' : `Switch to this branch — ${toPreview(subUser(activeText(seg.start), personaName), 160)}`}
                  onClick=${() => onJump(seg.id)}>
                  <span class="bg-top">
                    <span class="ct-dot ${seg.start.role === 'user' ? 'user' : 'assistant'}"></span>
                    <span class="bg-num">#${seg.num}</span>
                    ${seg.swipeTag && html`<span class="ct-sw">${seg.swipeTag}</span>`}
                    ${seg.chain.length > 1 && html`<span class="ct-len">${seg.chain.length} msg</span>`}
                    ${seg.hasLeaf && html`<span class="ct-leaf" title="The active end of the conversation">●</span>`}
                  </span>
                  <span class="bg-text">${toPreview(subUser(activeText(seg.start), personaName), 34) || '(empty)'}</span>
                </button>`;
            })}
          </div>
        </div>
      </div>`;
  }

  // ---- outline fallback (huge branch structures) ----
  const segView = (seg) => html`
    <div class="ct-node" key=${seg.id}>
      <button class="ct-row ${seg.onPath ? 'active' : ''} ${seg.hasLeaf ? 'leaf' : ''}" disabled=${generating}
        title=${generating ? 'Wait for the generation to finish' : 'Switch to the branch through this message'}
        onClick=${() => onJump(seg.id)}>
        <span class="ct-dot ${seg.start.role === 'user' ? 'user' : 'assistant'}"></span>
        <span class="ct-num">#${seg.num}</span>
        ${seg.swipeTag && html`<span class="ct-sw">${seg.swipeTag}</span>`}
        <span class="ct-text">${toPreview(subUser(activeText(seg.start), personaName), 110) || '(empty)'}</span>
        ${seg.chain.length > 1 && html`<span class="ct-len">${seg.chain.length} msg</span>`}
        ${seg.kids.length > 1 && html`<span class="ct-br" title=${`${seg.kids.length} branches continue from here`}>⎇ ${seg.kids.length}</span>`}
        ${seg.hasLeaf && html`<span class="ct-leaf" title="The active end of the conversation">●</span>`}
      </button>
      ${seg.kids.length > 1 && html`<div class="ct-kids">${seg.kids.map(segView)}</div>`}
    </div>`;
  return html`<div>${hint}<div class="ctree">${segRoots.map(segView)}</div></div>`;
}
const COMPOSER_COMMANDS = [
  ['/ooc [TEXT]', 'speak out of character'],
  ['/continue', 'continue the last reply'],
  ['/pov CHAR [TEXT]', 'reply from another character’s view'],
  ['/improve [TEXT]', 'rewrite your draft in persona voice'],
  ['/impersonate', 'draft your next message as you'],
  ['/image [PROMPT]', 'generate an image into the chat'],
  ['/recap [N]', 'summarize the last N messages'],
  ['/memory [N]', 'save a memory from the last N messages'],
  ['/model [NAME]', 'set this chat’s model'],
  ['/theme [NAME]', 'switch the UI theme'],
];

function Composer({ generating, busy, onSubmit, onStop, inject, chatId, initialText, onDraft, cmdArgs = null }) {
  // Draft text seeds from ChatPane's per-chat drafts store (this component
  // remounts per chat via key=chat.id) and every edit is reported back through
  // onDraft, so an unsent draft survives chat switches within the session.
  const [text, setTextRaw] = useState(() => initialText ?? '');
  const setText = (v) => { setTextRaw(v); onDraft?.(chatId, v); };
  const [hint, setHint] = useState(null);
  // Command feedback ("Theme set to Darker.", usage errors) auto-dismisses
  // after a few seconds instead of lingering under the composer.
  useEffect(() => {
    if (!hint) return;
    const t = setTimeout(() => setHint(null), 5000);
    return () => clearTimeout(t);
  }, [hint]);
  useEffect(() => {
    if (!inject) return;
    // Async injects (e.g. /improve) resolve seconds later; if the user
    // switched chats meanwhile, the text belongs to the other chat.
    if (inject.chatId && chatId && inject.chatId !== chatId) return;
    if ('text' in inject) setText(inject.text ?? '');
    if ('hint' in inject) setHint(inject.hint ?? null);
  }, [inject]);
  const send = () => {
    const t = text.trim();
    if (!t) return;
    const res = onSubmit(t); // returns an error hint string, or null when consumed
    if (res) setHint(res);
    else { setText(''); setHint(null); }
  };
  // Touch devices (coarse pointer) have no Shift on the soft keyboard, so
  // Enter is always a newline there — sending is the Send button's job.
  // Desktop keeps Enter-to-send, Shift+Enter for newline.
  const coarseEnter = window.matchMedia?.('(pointer: coarse)').matches;
  // Slash-command hints. Command-word mode (no space typed yet): offer
  // matching commands — an exact match stays listed when the command takes an
  // argument, since the bare name isn't done yet. Argument mode (`/pov mi`):
  // offer matches from that command's value list (cmdArgs prop: known
  // character names, theme names, seen model ids). ↑/↓ move a highlight
  // through the list (wrapping), Enter or Tab completes the highlighted
  // entry, Esc dismisses the popup so the raw text can still be sent as-is.
  const slash = text.startsWith('/');
  const sp = text.indexOf(' ');
  const cmdKey = slash ? (sp === -1 ? text : text.slice(0, sp)).toLowerCase() : '';
  const argPartial = sp === -1 ? '' : text.slice(sp + 1).trimStart();
  const cmdHints = slash && sp === -1
    ? COMPOSER_COMMANDS.filter(([c]) => {
        const w = c.split(' ')[0];
        return w.startsWith(cmdKey) && (w !== cmdKey || c.includes(' '));
      })
    : [];
  // Once the partial starts with a full value + space, the argument is done
  // and the rest is free text (e.g. /pov's steering) — stop hinting values.
  const argDomain = cmdArgs?.[cmdKey] ?? [];
  const argDone = argDomain.some(v => argPartial.toLowerCase().startsWith(v.toLowerCase() + ' '));
  const argHints = slash && sp !== -1 && !argDone
    ? argDomain.filter(v => {
        const lv = v.toLowerCase(), lp = argPartial.toLowerCase();
        return lv.includes(lp) && lv !== lp;
      })
    : [];
  // One normalized list for both modes (they're mutually exclusive).
  const [hi, setHi] = useState(0);       // highlighted hint index
  const [esc, setEsc] = useState(false); // popup dismissed until the next edit
  const hintItems = esc ? [] : cmdHints.length
    ? cmdHints.map(([c, d]) => ({ label: c, desc: d, completion: c.split(' ')[0] + (c.includes(' ') ? ' ' : '') }))
    : argHints.slice(0, 8).map(v => ({ label: v, desc: cmdKey, completion: `${cmdKey} ${v}` }));
  const hiIdx = Math.min(hi, Math.max(0, hintItems.length - 1));
  const completeHint = (i) => {
    const it = hintItems[i];
    if (!it) return;
    setText(it.completion);
    setHi(0);
    taRef.current?.focus();
  };
  // Auto-grow the textarea with the draft, capped (CSS max-height) so long
  // messages scroll internally instead of eating the screen. Resting state
  // (empty draft) is a single line regardless of focus.
  const taRef = useRef(null);
  useEffect(() => {
    const ta = taRef.current;
    if (!ta) return;
    if (!text) { ta.style.height = ''; return; }
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 200) + 'px';
  }, [text]);
  return html`
    <div class="composer">
      ${hintItems.length > 0 && html`
        <div class="cmd-hints">
          ${hintItems.map((it, i) => html`
            <button key=${it.label} class=${'cmd-hint' + (i === hiIdx ? ' sel' : '')}
              onMouseDown=${(e) => { e.preventDefault(); completeHint(i); }}>
              <span class="cmd">${it.label}</span><span class="desc">${it.desc}</span>
            </button>`)}
        </div>`}
      <div class="row">
        <textarea ref=${taRef} value=${text} rows=${1}
          placeholder="Type a message or /"
          onInput=${(e) => { setText(e.target.value); setHi(0); setEsc(false); }}
          onKeyDown=${(e) => {
            if (hintItems.length) {
              const n = hintItems.length;
              if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                e.preventDefault();
                setHi(h => (Math.min(h, n - 1) + (e.key === 'ArrowDown' ? 1 : n - 1)) % n);
                return;
              }
              if (e.key === 'Tab') { e.preventDefault(); completeHint(hiIdx); return; }
              if (e.key === 'Escape') { e.preventDefault(); setEsc(true); return; }
              if (e.key === 'Enter' && !e.shiftKey && !coarseEnter) { e.preventDefault(); completeHint(hiIdx); return; }
            }
            // While generating/busy, Enter falls through to a newline instead
            // of being swallowed with no effect.
            if (e.key === 'Enter' && !e.shiftKey && !coarseEnter && !generating && !busy) { e.preventDefault(); send(); }
          }} />
        ${generating || busy
          ? html`<button class="btn danger" title=${generating ? 'Stop generation' : 'Stop background calls (memory, generator, suggestions…)'}
              onClick=${onStop}>■ Stop</button>`
          : html`<button class="btn primary" onClick=${send}>Send</button>`}
      </div>
      ${hint && html`<div class="hint warn">${hint}</div>`}
    </div>`;
}

const NO_KIDS = []; // stable identity for MessageItem's memo (childless nodes)

function ChatPane({ chat, persona, characterNames, characterColors, avatars = null, avatarsOn = false, generating, genElsewhere = false, suggestions, onPickSuggestion, onRerollSuggestions,

  // oldest first. Keyed on the messages map so identities stay stable across
  // unrelated re-renders (MessageItem memo compares prop identities). The map
  // identity changes per streamed token, so kid arrays are cached: when every
  // child node object is unchanged (only the streaming node gets a fresh
  // identity per token) the previous array is reused, keeping branchKids
  // identity stable for every unaffected parent.
  const kidsCacheRef = useRef(new Map()); // parentId → last kids array
  const kidsByParent = useMemo(() => {
    const map = new Map();
    for (const n of Object.values(chat?.messages ?? {})) {
      if (!n?.parentId) continue;
      if (!map.has(n.parentId)) map.set(n.parentId, []);
      map.get(n.parentId).push(n);
    }
    const prev = kidsCacheRef.current;
    const cache = new Map();
    for (const [pid, kids] of map) {
      kids.sort((a, b) => ((a.swipes?.[0]?.createdAt ?? 0) - (b.swipes?.[0]?.createdAt ?? 0)) || (a.id < b.id ? -1 : 1));
      const old = prev.get(pid);

  const [showJump, setShowJump] = useState(false);

    const el = logRef.current;

  useEffect(() => {
    if (!selId) return;
    const el = logRef.current;

    const lr = el.getBoundingClientRect();

            selected=${node.id === selId}

            avatars=${avatars} avatarsOn=${avatarsOn}

            onEdit=${actions.onEdit} onRegenerate=${actions.onRegenerate} onSwipe=${actions.onSwipe}

            onOpenCharacter=${actions.onOpenCharacter}

                `}
          </div>`}

            <button class="sugg-chip imp-chip" title="The AI drafts your next message into the composer (/impersonate) — edit, then send"

        <div class="gen-reply">

        </div>`}
      <${Composer} key=${chat.id} chatId=${chat.id} generating=${!!generating || genElsewhere} busy=${auxBusy.length > 0}
        initialText=${draftsRef.current.get(chat.id) ?? ''} onDraft=${onDraft} cmdArgs=${cmdArgs}
        onSubmit=${onComposerSubmit} onStop=${onStop} inject=${draftRestore ?? composerInject} />
    </div>`;
